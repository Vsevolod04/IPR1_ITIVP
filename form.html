<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <title>Приём заявок на печать</title>
</head>

<body class="mb-0 bg-light">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>

    <header class="text-center fs-1 fw-bold">ПРИЁМ ЗАЯВОК НА ПЕЧАТЬ</header>

    <main class="me-3 ms-3">
        <form action="process.php" method="post" enctype="multipart/form-data">
            <div class="mb-3">
                <label for="customer_name" class="form-label">ФИО: <span class="text-danger">*</span></label>
                <div class="col-6">
                    <input type="text" name="customer_name" id="customer_name" class="form-control"
                        maxlength="200" placeholder="Иванов Иван Иванович" required>
                </div>
            </div>

            <div class="mb-3">
                <label for="tel_num" class="form-label">Номер телефона: <span class="text-danger">*</span></label>
                <div class="col-6">
                    <input type="tel" name="tel_num" id="tel_num" class="form-control" maxlength="13"
                        placeholder="+375290000000" required>
                </div>
            </div>

            <div class="mb-3">
                <label for="file" class="form-label">Файл для печати (word, pdf, png, jpeg): <span
                        class="text-danger">*</span></label>
                <div class="col-6">
                    <input type="file" name="file" id="file" class="form-control" required>
                </div>
            </div>

            <div class="mb-3">
                <label for="print_format" class="form-label">Формат печати: <span class="text-danger">*</span></label>
                <div class="col-6">
                    <input type="text" name="print_format" id="print_format" class="form-control" maxlength="200"
                        placeholder="ЧБ A4 / цветной A5 / фото глянец ..." required>
                </div>
            </div>

            <div class="mb-3">
                <label for="copies" class="form-label">Количество копий: <span class="text-danger">*</span></label>
                <div class="col-2">
                    <input type="number" name="copies" id="copies" class="form-control" min="1" max="500" value="1"
                        required>
                </div>
            </div>

            <div>
                <label for="pickup_date" class="form-label">Желаемая дата получения: <span
                        class="text-danger">*</span></label>
                <div class="col-6">
                    <input type="date" name="pickup_date" id="pickup_date" class="form-control" required>
                </div>
            </div>

            <div class="mt-4 mb-4">
                <button type="submit" class="btn btn-primary">Отправить</button>
                <button type="reset" class="btn btn-warning">Сброс</button>
            </div>
        </form>
    </main>

    <footer class="sticky-bottom pt-3 pb-2" style="background-color: #dedede;">
        <p class="text-center text-body-secondary" style="font-size: 0.8rem;">Веб-сервис приёма заявок на печать<br>
            &copy; Sorkin Vsevolod
        </p>
    </footer>
</body>

<script>
    const dateEl = document.getElementById("pickup_date");
    let date = new Date();
    let day, month, year;

    if (date.getDate() < 10) {
        day = "0" + date.getDate();
    } else day = date.getDate();

    if (date.getMonth() + 1 < 10) {
        month = "0" + (date.getMonth() + 1);
    } else month = date.getMonth() + 1;

    year = date.getFullYear()

    dateEl.min = year + "-" + month + "-" + day;

    date.setDate(date.getDate() + 14);

    if (date.getDate() < 10) {
        day = "0" + date.getDate();
    } else day = date.getDate();

    if (date.getMonth() + 1 < 10) {
        month = "0" + (date.getMonth() + 1);
    } else month = date.getMonth() + 1;

    year = date.getFullYear();

    dateEl.max = year + "-" + month + "-" + day;
</script>

</html>
